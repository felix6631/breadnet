; Load at startup, before PHP parses any request. Keep session upload progress off.
session.upload_progress.enabled = 0
display_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
post_max_size = 1M
upload_max_filesize = 512K
file_uploads = Off
max_input_vars = 50
memory_limit = 128M
